  Settings panel for my-plugin.

  The Host renders this markup in the plugin's settings panel, grouped under the
  settings.category ("custom" in this case). Keep all styles and scripts scoped to
  this panel using class prefixes based on the plugin id (my-plugin-settings).

  Settings values should be persisted through the plugin's own routes
  (/api/plugins/my-plugin/settings), not by writing files directly from the client.
-->
<div class="my-plugin-settings">
  <fieldset>
    <legend>Appearance</legend>

    <label>
      Color
      <select data-setting="color" class="my-plugin-settings__color-select">
        <option value="indigo">Indigo</option>
        <option value="crimson">Crimson</option>
        <option value="emerald">Emerald</option>
        <option value="amber">Amber</option>
      </select>
    </label>

    <label>
      Intensity (0-10)
      <input
        type="range"
        min="0"
        max="10"
        step="1"
        value="5"
        data-setting="intensity"
        class="my-plugin-settings__intensity-slider"
      />
      <span data-role="intensity-value">5</span>
    </label>
  </fieldset>

  <fieldset>
    <legend>Behavior</legend>

    <label>
      <input
        type="checkbox"
        data-setting="enable_animations"
        class="my-plugin-settings__enable-animations"
      />
      Enable animations
    </label>
  </fieldset>

  <button
    class="my-plugin-settings__save-button"
    data-role="save-settings"
  >
    Save Settings
  </button>
</div>

<script>
  // Simple settings persistence example.
  // In production, this would be more robust and handle loading saved values.
  (function () {
    const PLUGIN_ID = "my-plugin";
    const settingsPanel = document.querySelector(".my-plugin-settings");

    if (!settingsPanel) return;

    // Load saved settings
    async function loadSettings() {
      try {
        const res = await fetch(`/api/plugins/${PLUGIN_ID}/settings`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const settings = await res.json();

        // Populate form with saved values
        Object.entries(settings).forEach(([key, value]) => {
          const input = settingsPanel.querySelector(`[data-setting="${key}"]`);
          if (input) {
            if (input.type === "checkbox") {
              input.checked = value;
            } else if (input.type === "range") {
              input.value = value;
              const valueDisplay = settingsPanel.querySelector(
                `[data-role="${key}-value"]`
              );
              if (valueDisplay) valueDisplay.textContent = value;
            } else {
              input.value = value;
            }
          }
        });
      } catch (err) {
        console.warn(`${PLUGIN_ID}: could not load settings`, err);
      }
    }

    // Save settings when the save button is clicked
    settingsPanel.addEventListener("click", async (e) => {
      if (e.target.dataset.role === "save-settings") {
        const formData = {};
        settingsPanel
          .querySelectorAll("[data-setting]")
          .forEach((input) => {
            const key = input.dataset.setting;
            if (input.type === "checkbox") {
              formData[key] = input.checked;
            } else if (input.type === "range") {
              formData[key] = Number(input.value);
            } else {
              formData[key] = input.value;
            }
          });

        try {
          const res = await fetch(`/api/plugins/${PLUGIN_ID}/settings`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          console.log(`${PLUGIN_ID}: settings saved`);
        } catch (err) {
          console.error(`${PLUGIN_ID}: failed to save settings`, err);
        }
      }
    });

    // Update intensity display when slider changes
    const intensitySlider = settingsPanel.querySelector(
      "[data-setting='intensity']"
    );
    if (intensitySlider) {
      intensitySlider.addEventListener("input", (e) => {
        const valueDisplay = settingsPanel.querySelector(
          "[data-role='intensity-value']"
        );
        if (valueDisplay) valueDisplay.textContent = e.target.value;
      });
    }

    // Load settings on panel load
    loadSettings();
  })();
</script>
