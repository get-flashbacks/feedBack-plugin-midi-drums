name: Auto Assign Action

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Auto Assign Action
        uses: kentaro-m/auto-assign-action@v2.0.2
