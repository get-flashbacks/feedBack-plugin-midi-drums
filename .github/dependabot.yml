# Group minor/patch version updates to limit PR noise.
# Preserve existing schedules and major-version restrictions; no auto-merge.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
